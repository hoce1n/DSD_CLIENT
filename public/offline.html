<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین - سفارش یار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            direction: rtl;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .features {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .feature {
            margin-bottom: 1rem;
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .feature::before {
            content: "✓";
            margin-left: 10px;
            color: #4ade80;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon pulse">
            📡
        </div>
        
        <h1>شما آفلاین هستید</h1>
        
        <p>
            اتصال اینترنت شما قطع شده است. لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.
        </p>
        
        <button class="retry-btn" onclick="location.reload()">
            تلاش مجدد
        </button>
        
        <div class="features">
            <div class="feature">برخی از اطلاعات در حافظه محلی ذخیره شده‌اند</div>
            <div class="feature">پس از برقراری اتصال، اطلاعات به‌روزرسانی می‌شوند</div>
            <div class="feature">تجربه کاربری بهینه حتی در حالت آفلاین</div>
        </div>
    </div>

    <script>
        // بررسی اتصال اینترنت
        function checkConnection() {
            if (navigator.onLine) {
                location.reload();
            }
        }
        
        // گوش دادن به تغییرات اتصال
        window.addEventListener('online', checkConnection);
        
        // بررسی دوره‌ای اتصال
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
